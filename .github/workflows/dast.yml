name: DAST Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dast-demo .

      - name: Create Docker network
        run: docker network create dast-net

      - name: Start Flask app
        run: docker run -d --name dast-app --network dast-net dast-demo

      - name: Wait for Flask app
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network dast-net curlimages/curl:latest -fsS http://dast-app:5000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs dast-app
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-output"
          chmod 777 "$GITHUB_WORKSPACE/zap-output"
          docker run --rm --network dast-net \
            -v "$GITHUB_WORKSPACE/zap-output:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://dast-app:5000 -I \
            -J zap-report.json -r zap-report.html

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-output/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker rm -f dast-app || true
          docker network rm dast-net || true
